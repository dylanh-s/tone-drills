<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>tone-drill</title>
  <style>
    :root {
      --bg: #101418;
      --bg2: #1b2027;
      --panel: #141a20;
      --accent: #50b4ff;
      --ok: #79dd6f;
      --bad: #ff6b6b;
      --dim: #7c7c7c;
      --warn: #f2c14e;
      --white: #e8e8e8;
      --grey: #c8c8c8;
      --mono: "SF Mono", "JetBrains Mono", "Fira Code", Menlo, Consolas, monospace;
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body {
      background: var(--bg);
      color: var(--white);
      font-family: var(--mono);
      font-size: 15px;
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
    }
    #app {
      max-width: 760px;
      margin: 0 auto;
      min-height: 100%;
      display: flex;
      flex-direction: column;
      padding: 0 12px env(safe-area-inset-bottom);
    }

    /* -- header -- */
    #header {
      display: flex;
      justify-content: space-between;
      gap: 16px;
      padding: 14px 6px 10px;
      flex-wrap: wrap;
    }
    .grid {
      display: grid;
      grid-template-columns: auto auto;
      gap: 1px 10px;
      align-content: start;
    }
    .glabel { color: var(--accent); text-align: right; }
    .gval { color: var(--white); }

    /* -- body / panel -- */
    /* Top-anchored (not centred): the panel grows/shrinks from its bottom
       edge, so the hanzi and options stay put across answer -> result while the
       border hugs the content — no reserved whitespace inside the box. */
    #body { flex: 1; display: flex; align-items: flex-start; justify-content: center; padding: 10px 2px 18px; }
    .panel {
      position: relative;
      width: 100%;
      border: 1px solid var(--accent);
      border-radius: 6px;
      background: var(--panel);
      padding: 26px 22px 22px;
    }
    .panel.b-ok { border-color: var(--ok); }
    .panel.b-accent { border-color: var(--accent); }
    .panel-title {
      position: absolute;
      top: -0.75em;
      left: 14px;
      background: var(--panel);
      padding: 0 8px;
      color: var(--accent);
      font-size: 13px;
    }
    .panel.b-ok > .panel-title { color: var(--ok); }
    .panel-body { display: flex; flex-direction: column; align-items: center; text-align: center; gap: 10px; }

    .hanzi { font-size: 42px; font-weight: 700; letter-spacing: 4px; color: var(--white); }
    .hanzi.dim { color: var(--dim); }

    /* -- classic pad -- */
    .typed { margin-top: 6px; }
    .typed .big { font-size: 26px; letter-spacing: 3px; }
    .pad { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; margin-top: 10px; }
    .btn {
      font-family: var(--mono);
      font-size: 18px;
      min-width: 46px;
      padding: 10px 14px;
      background: var(--bg2);
      color: var(--white);
      border: 1px solid #2c343d;
      border-radius: 5px;
      cursor: pointer;
    }
    .btn:hover { border-color: var(--accent); }
    .btn:active { transform: translateY(1px); }
    .btn-go { background: var(--accent); color: #05121f; border-color: var(--accent); font-weight: 700; }
    .btn-go:hover { filter: brightness(1.08); }
    .btn.wide { width: 100%; max-width: 260px; }

    /* -- prompt row: hanzi + play controls, aligned to the options width so the
       play button lines up with the per-option play buttons below -- */
    .hanzi-row { display: flex; align-items: center; gap: 8px; width: 100%; max-width: 420px; margin: 0 auto; }
    .hanzi-spacer { flex: 1; }
    .hanzi-play { flex: 1; display: flex; justify-content: flex-end; gap: 8px; }

    /* -- lucia options -- */
    .options { display: flex; flex-direction: column; gap: 8px; width: 100%; max-width: 420px; margin: 4px 0; }
    .opt { display: flex; align-items: center; gap: 8px; }
    .opt-label {
      flex: 1;
      text-align: left;
      font-family: var(--mono);
      font-size: 18px;
      line-height: 1.4;              /* match .opt-result so rows are identical height */
      padding: 9px 12px;
      background: var(--bg2);
      color: var(--white);
      border: 1px solid #2c343d;
      border-radius: 5px;
      cursor: pointer;
      letter-spacing: 2px;
    }
    .opt-label:hover { border-color: var(--accent); }
    .opt-label.sel { background: var(--ok); color: #05140a; font-weight: 700; border-color: var(--ok); }
    .opt-sentence {
      font-family: var(--mono);
      font-size: 13px;
      padding: 8px 10px;
      background: transparent;
      color: var(--dim);
      border: 1px solid #2c343d;
      border-radius: 5px;
      cursor: pointer;
    }
    .opt-sentence:hover { color: var(--accent); border-color: var(--accent); }
    .opt-result {
      flex: 1;
      display: flex;
      align-items: center;
      gap: 8px;
      text-align: left;
      font-size: 18px;
      line-height: 1.4;               /* match .opt-label so rows are identical height */
      letter-spacing: 2px;
      padding: 9px 12px;              /* match .opt-label box height */
      border: 1px solid transparent;
    }
    .mark { font-weight: 700; width: 1em; text-align: center; flex: none; }
    .dim-pair { opacity: 0.8; }

    /* -- verdict -- */
    .reveal { margin-top: 2px; }
    .nav-hint { margin-top: 8px; }

    /* -- results -- */
    .big2 { font-size: 20px; }
    .huge { font-size: 40px; }
    .tally { display: grid; grid-template-columns: auto auto; gap: 2px 14px; margin: 10px 0; }
    .tally-row { display: contents; }
    .missed-title { margin-top: 8px; }
    .missed { display: flex; flex-direction: column; gap: 3px; }
    .miss-row { display: grid; grid-template-columns: 1fr auto auto auto; gap: 12px; align-items: center; }
    .miss-row > .right { text-align: right; }

    /* -- menu -- */
    .menu-brand { padding: 4px 2px; }
    .menu-body { align-items: stretch; text-align: left; gap: 10px; width: 100%; }
    .menu-item {
      display: flex;
      align-items: center;
      gap: 12px;
      width: 100%;
      text-align: left;
      font-family: var(--mono);
      padding: 12px 14px;
      background: var(--bg2);
      color: var(--white);
      border: 1px solid #2c343d;
      border-radius: 6px;
      cursor: pointer;
    }
    .menu-item:hover { border-color: var(--accent); }
    .menu-item.sel { border-color: var(--accent); background: #182531; }
    .menu-item.disabled {
      cursor: default;
      opacity: 0.5;
    }
    .menu-item.disabled:hover { border-color: #2c343d; }
    .menu-item.disabled .key { background: var(--dim); color: #0c0c0c; }
    .menu-text { display: flex; flex-direction: column; gap: 2px; }
    .menu-title { font-size: 17px; color: var(--white); }
    .menu-hint { margin: 0; }

    /* -- help -- */
    .help { align-items: stretch; text-align: left; gap: 4px; }
    .section-title { margin-top: 8px; }
    .help-grid { display: grid; grid-template-columns: auto 1fr; gap: 2px 16px; }

    /* -- footer -- */
    #footer {
      display: flex;
      flex-wrap: wrap;
      gap: 4px;
      padding: 8px 4px 14px;
      justify-content: center;
    }
    .fbtn {
      display: inline-flex;
      align-items: center;
      background: var(--bg2);
      border: none;
      border-radius: 4px;
      padding: 0;
      cursor: pointer;
      overflow: hidden;
      font-family: var(--mono);
      font-size: 13px;
    }
    .fbtn:hover .fdesc { color: var(--white); }
    .fdesc { color: var(--grey); padding: 4px 8px; }

    .key {
      background: var(--accent);
      color: #05121f;
      font-weight: 700;
      padding: 4px 6px;
    }

    /* -- color utilities -- */
    .accent { color: var(--accent); }
    .ok { color: var(--ok); }
    .bad { color: var(--bad); }
    .dim { color: var(--dim); }
    .warn { color: var(--warn); }
    .white { color: var(--white); }
    .bold { font-weight: 700; }
    .small { font-size: 13px; }
    .big { font-size: 26px; }
    .right { text-align: right; }
    .flash { margin-top: 6px; min-height: 1.4em; }

    @media (max-width: 480px) {
      .hanzi { font-size: 34px; }
      body { font-size: 14px; }
    }
  </style>
</head>
<body>
  <div id="app"></div>
  <script type="module" src="js/main.js"></script>
</body>
</html>
